global:
  scrape_interval: 15s
  evaluation_interval: 15s
  scrape_timeout: 10s

scrape_configs:
  - job_name: "chaosguard-gateway"
    metrics_path: /actuator/prometheus
    static_configs:
      - targets: ["gateway:8080"]
        labels:
          service: gateway
          environment: dev

  - job_name: "chaosguard-agents"
    metrics_path: /metrics
    static_configs:
      - targets: ["agents:8082"]
        labels:
          service: agents
          environment: dev

  - job_name: "prometheus"
    static_configs:
      - targets: ["localhost:9090"]
