name: ChaosGuard CI

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]

jobs:
  python-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          cd agents
          pip install -r requirements.txt
          pip install pytest pytest-asyncio pytest-cov ruff mypy
      - name: Lint with ruff
        run: ruff check agents/
      - name: Type check with mypy
        run: mypy agents/ --ignore-missing-imports --no-strict-optional
      - name: Run tests
        run: pytest agents/tests/ -v --tb=short --cov=agents --cov-report=xml
      - name: Upload coverage
        uses: codecov/codecov-action@v4
        with:
          file: coverage.xml
          flags: python-agents

  java-gateway:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'
          cache: 'maven'
      - name: Build and test
        run: cd gateway && mvn verify -B -q
      - name: SpotBugs analysis
        run: cd gateway && mvn spotbugs:check -B -q
        continue-on-error: true

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: cd frontend && npm ci
      - name: Lint
        run: cd frontend && npm run lint
      - name: Build
        run: cd frontend && npm run build

  docker-build:
    runs-on: ubuntu-latest
    needs: [python-agents, java-gateway, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Build all Docker images
        run: docker compose build --parallel
      - name: Start services and health check
        run: |
          docker compose up -d
          echo "Waiting for services to be healthy..."
          sleep 30
          # Check gateway health
          curl -f http://localhost:8080/actuator/health || exit 1
          docker compose down -v
