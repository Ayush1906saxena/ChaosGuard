apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "chaosguard.fullname" . }}-indexer
  namespace: {{ include "chaosguard.namespace" . }}
  labels:
    {{- include "chaosguard.componentLabels" (dict "Root" . "Component" "indexer") | nindent 4 }}
spec:
  replicas: {{ .Values.indexer.replicaCount }}
  selector:
    matchLabels:
      {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "indexer") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "chaosguard.componentLabels" (dict "Root" . "Component" "indexer") | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") . | sha256sum }}
        checksum/secret: {{ include (print $.Template.BasePath "/secret.yaml") . | sha256sum }}
    spec:
      containers:
        - name: indexer
          image: "{{ .Values.indexer.image.repository }}:{{ .Values.indexer.image.tag }}"
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: 8081
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "chaosguard.fullname" . }}-config
            - secretRef:
                name: {{ include "chaosguard.fullname" . }}-secrets
          {{- with .Values.indexer.env }}
          env:
            {{- range $key, $value := . }}
            - name: {{ $key }}
              value: {{ $value | quote }}
            {{- end }}
          {{- end }}
          livenessProbe:
            httpGet:
              path: {{ .Values.indexer.probes.liveness.path }}
              port: http
            initialDelaySeconds: {{ .Values.indexer.probes.liveness.initialDelaySeconds }}
            periodSeconds: {{ .Values.indexer.probes.liveness.periodSeconds }}
            timeoutSeconds: {{ .Values.indexer.probes.liveness.timeoutSeconds }}
            failureThreshold: {{ .Values.indexer.probes.liveness.failureThreshold }}
          readinessProbe:
            httpGet:
              path: {{ .Values.indexer.probes.readiness.path }}
              port: http
            initialDelaySeconds: {{ .Values.indexer.probes.readiness.initialDelaySeconds }}
            periodSeconds: {{ .Values.indexer.probes.readiness.periodSeconds }}
            timeoutSeconds: {{ .Values.indexer.probes.readiness.timeoutSeconds }}
            failureThreshold: {{ .Values.indexer.probes.readiness.failureThreshold }}
          resources:
            requests:
              cpu: {{ .Values.indexer.resources.requests.cpu }}
              memory: {{ .Values.indexer.resources.requests.memory }}
            limits:
              cpu: {{ .Values.indexer.resources.limits.cpu }}
              memory: {{ .Values.indexer.resources.limits.memory }}
          volumeMounts:
            - name: repo-data
              mountPath: /tmp/chaosguard/repos
      volumes:
        - name: repo-data
          emptyDir: {}
