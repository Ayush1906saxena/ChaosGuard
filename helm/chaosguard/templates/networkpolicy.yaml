{{- if .Values.networkPolicy.enabled }}
---
# Frontend: allow ingress from ingress controller only, egress to gateway
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chaosguard.fullname" . }}-frontend
  namespace: {{ include "chaosguard.namespace" . }}
  labels:
    {{- include "chaosguard.componentLabels" (dict "Root" . "Component" "frontend") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "frontend") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 3000
  egress:
    - to:
        - podSelector:
            matchLabels:
              {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Gateway: allow ingress from frontend and ingress controller, egress to agents, indexer, and infra
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chaosguard.fullname" . }}-gateway
  namespace: {{ include "chaosguard.namespace" . }}
  labels:
    {{- include "chaosguard.componentLabels" (dict "Root" . "Component" "gateway") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "gateway") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "frontend") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8080
    - from:
        - namespaceSelector: {}
          podSelector:
            matchLabels:
              app.kubernetes.io/name: ingress-nginx
      ports:
        - protocol: TCP
          port: 8080
  egress:
    # Postgres
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # Redis
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
    # Kafka
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9092
    # Agents
    - to:
        - podSelector:
            matchLabels:
              {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "agents") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8082
    # Indexer
    - to:
        - podSelector:
            matchLabels:
              {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "indexer") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8081
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Agents: allow ingress from gateway, egress to Kafka, Redis, ChromaDB, Ollama
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chaosguard.fullname" . }}-agents
  namespace: {{ include "chaosguard.namespace" . }}
  labels:
    {{- include "chaosguard.componentLabels" (dict "Root" . "Component" "agents") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "agents") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8082
  egress:
    # Kafka
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9092
    # Redis
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 6379
    # ChromaDB
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
    # Ollama
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 11434
    # Postgres
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 5432
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
# Indexer: allow ingress from gateway, egress to Kafka, ChromaDB, Ollama
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "chaosguard.fullname" . }}-indexer
  namespace: {{ include "chaosguard.namespace" . }}
  labels:
    {{- include "chaosguard.componentLabels" (dict "Root" . "Component" "indexer") | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "indexer") | nindent 6 }}
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "gateway") | nindent 14 }}
      ports:
        - protocol: TCP
          port: 8081
  egress:
    # Kafka
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 9092
    # ChromaDB
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 8000
    # Ollama
    - to:
        - podSelector: {}
      ports:
        - protocol: TCP
          port: 11434
    # DNS
    - to:
        - namespaceSelector: {}
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
