apiVersion: v1
kind: Service
metadata:
  name: {{ include "chaosguard.fullname" . }}-indexer
  namespace: {{ include "chaosguard.namespace" . }}
  labels:
    {{- include "chaosguard.componentLabels" (dict "Root" . "Component" "indexer") | nindent 4 }}
spec:
  type: {{ .Values.indexer.service.type }}
  ports:
    - port: {{ .Values.indexer.service.port }}
      targetPort: http
      protocol: TCP
      name: http
  selector:
    {{- include "chaosguard.selectorLabels" (dict "Root" . "Component" "indexer") | nindent 4 }}
