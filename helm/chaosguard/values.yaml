# -- Global settings
global:
  namespace: chaosguard
  imagePullPolicy: IfNotPresent

# -- Gateway (Spring Boot)
gateway:
  replicaCount: 2
  image:
    repository: chaosguard/gateway
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8080
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 1Gi
  probes:
    liveness:
      path: /actuator/health
      initialDelaySeconds: 30
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /actuator/health
      initialDelaySeconds: 15
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  env: {}

# -- Agents (Python FastAPI)
agents:
  replicaCount: 2
  image:
    repository: chaosguard/agents
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8082
  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 4Gi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  hpa:
    enabled: true
    minReplicas: 2
    maxReplicas: 8
    targetCPUUtilizationPercentage: 70
  env: {}

# -- Indexer (Python FastAPI)
indexer:
  replicaCount: 1
  image:
    repository: chaosguard/indexer
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 8081
  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: "1"
      memory: 2Gi
  probes:
    liveness:
      path: /health
      initialDelaySeconds: 15
      periodSeconds: 10
      timeoutSeconds: 5
      failureThreshold: 3
    readiness:
      path: /health
      initialDelaySeconds: 10
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  env: {}

# -- Frontend (Next.js)
frontend:
  replicaCount: 2
  image:
    repository: chaosguard/frontend
    tag: "1.0.0"
  service:
    type: ClusterIP
    port: 3000
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi
  probes:
    liveness:
      path: /
      initialDelaySeconds: 10
      periodSeconds: 10
      timeoutSeconds: 3
      failureThreshold: 3
    readiness:
      path: /
      initialDelaySeconds: 5
      periodSeconds: 5
      timeoutSeconds: 3
      failureThreshold: 3
  env:
    NEXT_PUBLIC_API_URL: "http://gateway:8080"
    NEXT_PUBLIC_WS_URL: "ws://gateway:8080"

# -- Infrastructure endpoints
config:
  kafka:
    bootstrapServers: "kafka:9092"
  redis:
    host: "redis"
    port: "6379"
  postgres:
    host: "postgres"
    port: "5432"
    database: "chaosguard"
    dsn: "postgresql://chaosguard:changeme@postgres:5432/chaosguard"
  ollama:
    url: "http://ollama:11434"
  chromadb:
    url: "http://chromadb:8000"

# -- Secrets (override in production via sealed-secrets or external-secrets)
secrets:
  jwtSecret: "Y2hhbmdlbWUtand0LXNlY3JldA=="  # changeme-jwt-secret
  postgres:
    username: "Y2hhb3NndWFyZA=="  # chaosguard
    password: "Y2hhbmdlbWU="      # changeme

# -- Ingress
ingress:
  enabled: true
  className: nginx
  annotations:
    nginx.ingress.kubernetes.io/proxy-body-size: "50m"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "300"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "300"
  host: chaosguard.local
  tls:
    enabled: false
    secretName: chaosguard-tls

# -- Network policies
networkPolicy:
  enabled: true
