services:
  # ======== Infrastructure ========

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: chaosguard
      POSTGRES_USER: chaosguard
      POSTGRES_PASSWORD: chaosguard_dev_2026
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./scripts/init-db.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U chaosguard"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    command: redis-server --maxmemory 512mb --maxmemory-policy allkeys-lru
    networks:
      - internal
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  kafka:
    image: apache/kafka:3.7.0
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 0
      KAFKA_PROCESS_ROLES: controller,broker
      KAFKA_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_NUM_PARTITIONS: 3
      KAFKA_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_LOG_RETENTION_HOURS: 24
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      CLUSTER_ID: "chaosguard-kafka-cluster-01"
    volumes:
      - kafka_data:/tmp/kraft-combined-logs
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-topics.sh --bootstrap-server localhost:9092 --list || exit 1"]
      interval: 10s
      timeout: 10s
      retries: 10

  chromadb:
    image: chromadb/chroma:latest
    ports:
      - "8000:8000"
    volumes:
      - chroma_data:/data
    environment:
      ANONYMIZED_TELEMETRY: "false"
    networks:
      - internal
    healthcheck:
      test: ["CMD-SHELL", "chroma --version || exit 0"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Ollama runs natively on host for Metal GPU acceleration.
  # Start it with: ollama serve
  # Models needed: nomic-embed-text, llama3.1:8b, deepseek-coder-v2:16b
  # Services connect via host.docker.internal:11434

  # ======== Application Services ========

  gateway:
    build:
      context: ./gateway
      dockerfile: Dockerfile
    ports:
      - "8080:8080"
    env_file: .env
    volumes:
      - clone_data:/tmp/chaosguard/repos
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      kafka:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/actuator/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  indexer:
    build:
      context: ./indexer
      dockerfile: Dockerfile
    ports:
      - "8081:8081"
    env_file: .env
    volumes:
      - clone_data:/tmp/chaosguard/repos
    depends_on:
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  agents:
    build:
      context: ./agents
      dockerfile: Dockerfile
    ports:
      - "8082:8082"
    env_file: .env
    volumes:
      - clone_data:/tmp/chaosguard/repos
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8082/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  agents-recon:
    build:
      context: ./agents
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - clone_data:/tmp/chaosguard/repos
    environment:
      WORKER_TIER: RECON
      KAFKA_GROUP_ID: chaosguard-agents-recon
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "1"
          memory: 2G
    depends_on:
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    command: ["python", "worker.py"]

  agents-hunter:
    build:
      context: ./agents
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - clone_data:/tmp/chaosguard/repos
    environment:
      WORKER_TIER: HUNTER
      KAFKA_GROUP_ID: chaosguard-agents-hunter
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2"
          memory: 4G
    depends_on:
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    command: ["python", "worker.py"]

  agents-siege:
    build:
      context: ./agents
      dockerfile: Dockerfile
    env_file: .env
    volumes:
      - clone_data:/tmp/chaosguard/repos
    environment:
      WORKER_TIER: SIEGE
      KAFKA_GROUP_ID: chaosguard-agents-siege
    deploy:
      replicas: 1
      resources:
        limits:
          cpus: "2"
          memory: 4G
    depends_on:
      kafka:
        condition: service_healthy
      chromadb:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - internal
      - external
    command: ["python", "worker.py"]

  mcp-server:
    build:
      context: ./mcp-server
      dockerfile: Dockerfile
    ports:
      - "5001:5001"
    env_file: .env
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - internal
      - external
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5002/health"]
      interval: 10s
      timeout: 5s
      retries: 5

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8080
      NEXT_PUBLIC_WS_URL: ws://localhost:8080
    depends_on:
      gateway:
        condition: service_healthy
    networks:
      - external

networks:
  internal:
    driver: bridge
    internal: true
  external:
    driver: bridge

volumes:
  postgres_data:
  kafka_data:
  clone_data:
  chroma_data:
